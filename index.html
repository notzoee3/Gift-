<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Playlist</title>
  <style>
    body {
      margin: 0;
      background-color: #121212;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      font-size: 48px;
      margin-bottom: 20px;
      color: #1DB954;
    }
    button {
      background-color: #1DB954;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 20px;
      border-radius: 50px;
      cursor: pointer;
      margin: 10px;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #1ed760;
    }
  </style>
</head>
<body>
  <audio id="bg-music" src="https://www.bensound.com/bensound-music/bensound-sunny.mp3" loop></audio>
  <h1>Happy Birthday!</h1>
  <button onclick="playMusic()">Play Surprise</button>
  <button onclick="goToCandle()">Tiup Lilin Sekarang</button>

  <script>
    function playMusic() {
      document.getElementById('bg-music').play();
      setTimeout(() => {
        openPopup('I love you!');
      }, 1000);
      setTimeout(() => {
        openPopup('Semoga harimu indah!');
      }, 3000);
      setTimeout(() => {
        openPopup('Selamat ulang tahun!');
      }, 5000);
    }

    function openPopup(message) {
      const popup = window.open('', '', 'width=300,height=150');
      popup.document.write(`
        <body style="background: #121212; color: #1DB954; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh;">
          <div>
            <h2>${message}</h2>
            <button onclick="window.close()" style="padding: 10px 20px; background: #1DB954; color: white; border: none; border-radius: 20px; cursor: pointer;">OK</button>
          </div>
        </body>
      `);
    }

    function goToCandle() {
      window.location.href = 'tiup-lilin.html';
    }
  </script>
</body>
</html>
