<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameBoy UI</title>
  <style>
    body {
      background-color: #2b2b2b;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
    .gameboy {
      width: 300px;
      height: 500px;
      background: #c4c4c4;
      border-radius: 20px;
      box-shadow: inset -5px -5px 15px rgba(255, 255, 255, 0.6), inset 5px 5px 15px rgba(0, 0, 0, 0.2);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .screen {
      width: 220px;
      height: 180px;
      background: #1a1a1a;
      border: 4px solid #333;
      margin-bottom: 20px;
      border-radius: 10px;
    }
    .dpad, .buttons, .start-select {
      display: flex;
      margin-bottom: 20px;
    }
    .dpad {
      flex-direction: column;
      align-items: center;
    }
    .dpad div, .buttons div, .start-select div {
      background: #333;
      width: 20px;
      height: 20px;
      margin: 5px;
      border-radius: 4px;
    }
    .dpad-horizontal {
      display: flex;
    }
    .buttons div {
      border-radius: 50%;
    }
    .start-select div {
      width: 40px;
      height: 15px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="gameboy">
    <div class="screen"></div>
    <div class="dpad">
      <div></div>
      <div class="dpad-horizontal">
        <div></div>
        <div></div>
        <div></div>
      </div>
      <div></div>
    </div>
    <div class="buttons">
      <div></div>
      <div></div>
    </div>
    <div class="start-select">
      <div></div>
      <div></div>
    </div>
  </div>
</body>
</html>
